name: 開発対象（親）
description: 開発対象の親 Issue（目的・理由・範囲・完了条件）。要件定義・設計・実装は子 Issue に切る。実装方法は書かない。
title: ""
labels: ["slice"]
body:
  - type: markdown
    attributes:
      value: |
        タイトルは Conventional Commits の種別で始める（このリポジトリの commit / PR と同じ）。`feat:` 固定ではない。

        - `feat:` 新機能・画面追加（「追加」もこれ。`add:` は使わない）
        - `fix:` 不具合修正
        - `docs:` ドキュメントのみ
        - `refactor:` 挙動を変えない整理
        - `chore:` 開発基盤・雑務

        画面に閉じる変更は種別を増やさず、スコープで書く。例: `feat(ui): 検索フィルタを追加` / `fix(ui): ボタンが重なる`

        例: `feat: 家族グループへのメンバー追加` / `fix: 確認メールのリンク先が間違っている`

        要件定義・設計の本文は `docs/01_requirements`〜`docs/04_decisions` に置く。変更種別は作成時は空でよい（`/plan` で確定する）。
        要件定義・設計・テスト設計・実装の Issue は、この Issue の子として、各プロセスの開始時に Skill（`/requirements` `/design` `/test-design` `/implement`）が作る（`docs/05_development/issue-workflow.md`）。
  - type: dropdown
    id: type
    attributes:
      label: 種別
      description: タイトル先頭と一致させる。該当するものを選ぶ（feat 固定ではない）。
      options:
        - feat
        - fix
        - docs
        - refactor
        - chore
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目的
      description: 何を実現するか（1〜3文）
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: なぜ作るか
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 含めること
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: 含めないこと
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 利用者から見て終わった状態。テストケースや実装手順は書かない。
    validations:
      required: true
  - type: checkboxes
    id: change-types
    attributes:
      label: 変更種別（任意。/plan で確定する）
      options:
        - label: ドメイン
        - label: データベース
        - label: アプリケーション
        - label: API
        - label: UI
        - label: テスト戦略
        - label: ADR
